[project]
name = "cormorant"
version = "0.1.0"
description = "Deep research. Consulting grade. Runs while you sleep."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "rich>=13.7.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "jsonschema>=4.21.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
cormorant = "cormorant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
